<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Вес">
<meta name="theme-color" content="#eef3f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1a26" media="(prefers-color-scheme: dark)">
<title>Вес семьи</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #eef3f6;
    --surface: #ffffff;
    --ink: #14263b;
    --muted: #5d6f82;
    --line: #d5dfe7;
    --err: #c0392b;
    --c-vadim: #14798a;
    --c-ochir: #b9770e;
    --c-oyuna: #8a3f9c;
    --on-accent: #ffffff;
    --accent: var(--c-vadim);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a26;
      --surface: #172637;
      --ink: #e8eff6;
      --muted: #9fb0c2;
      --line: #2a3d52;
      --err: #ff8a7a;
      --c-vadim: #4cc3d6;
      --c-ochir: #f0b24a;
      --c-oyuna: #d58be6;
      --on-accent: #0f1a26;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  button, input, textarea { font: inherit; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .screen {
    min-height: 100vh; min-height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always;
    display: flex; flex-direction: column;
    max-width: 480px; margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  }
  .hidden { display: none !important; }

  /* ---------- Экран 1 ---------- */
  .entry { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; }
  .date { font-size: 16px; color: var(--muted); margin-bottom: 6px; }
  .entry label { display: block; font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .field { display: flex; align-items: baseline; justify-content: center; gap: 8px; }
  .field input {
    width: 5ch; font-size: 76px; font-weight: 700; text-align: center;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    border: 0; border-bottom: 3px solid var(--line); background: transparent; color: var(--ink);
    padding: 0 0 4px; border-radius: 0; outline: none; caret-color: var(--accent);
    transition: border-color .15s;
  }
  .field input::placeholder { color: var(--line); opacity: 1; }
  .field input:focus { border-bottom-color: var(--accent); }
  .field input:focus::placeholder { color: transparent; }
  .field span { font-size: 26px; color: var(--muted); }
  .link { background: none; border: 0; color: var(--accent); font-size: 14px; text-decoration: underline; cursor: pointer; padding: 4px 6px; }
  .days { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 6px 0 10px; }
  .chip { border: 1.5px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  #dayPick { font-size: 16px; padding: 5px 8px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
  .hint { min-height: 40px; margin: 10px 0 12px; font-size: 14px; color: var(--muted); line-height: 1.4; }
  .hint.err { color: var(--err); }
  .save {
    width: 100%; font-size: 18px; font-weight: 600; padding: 15px;
    border: 0; border-radius: 14px; background: var(--accent); color: var(--on-accent); cursor: pointer;
  }
  .save:disabled { opacity: .6; cursor: default; }
  .save:active:not(:disabled) { transform: translateY(1px); }

  /* после сохранения */
  .check {
    width: 84px; height: 84px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
    display: grid; place-items: center; margin: 0 auto 16px;
    animation: pop .35s ease-out;
  }
  .check svg { width: 44px; height: 44px; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .check { animation: none; } }
  .saved-title { font-size: 26px; font-weight: 700; }
  .saved-weight { font-size: 18px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .reaction { min-height: 28px; font-size: 20px; margin-top: 8px; }
  .actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
  .ghost {
    background: transparent; border: 1.5px solid var(--line); color: var(--ink);
    border-radius: 12px; padding: 9px 16px; font-size: 15px; cursor: pointer;
  }
  .comment { margin-top: 16px; text-align: left; }
  .comment textarea {
    width: 100%; font-size: 16px; padding: 12px; border-radius: 12px; resize: none;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .comment .save { margin-top: 10px; font-size: 16px; padding: 12px; }

  .nav {
    align-self: center; display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 14px; color: var(--muted); background: transparent; border: 0;
    padding: 8px 16px; cursor: pointer; border-radius: 12px;
  }
  .nav svg { width: 22px; height: 22px; }
  .nav.up { margin-bottom: 8px; }

  /* ---------- Экран 2 ---------- */
  .screen-charts { padding-top: max(22px, env(safe-area-inset-top)); }
  h2 { font-size: 15px; font-weight: 600; color: var(--muted); margin: 8px 0 10px; }
  .rows { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .row { display: flex; gap: 8px; align-items: stretch; margin-bottom: 10px; }
  .blk { background: var(--surface); border-radius: 14px; border: 1.5px solid transparent; }
  .mmcol { flex: 0 0 58px; display: flex; flex-direction: column; gap: 8px; }
  .mmbox {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 6px 2px;
  }
  .arr { width: 18px; height: 18px; color: var(--muted); flex: 0 0 auto; }
  .main { flex: 1; min-width: 0; padding: 12px 12px 8px; }
  .row.me .main { border-color: var(--accent); }
  .tab {
    flex: 0 0 40px; color: var(--muted); font-size: 13px; letter-spacing: 1px; cursor: pointer;
    writing-mode: vertical-rl; text-orientation: upright; padding: 0;
  }
  .row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .name { font-weight: 600; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .val { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .val small { font-size: 14px; font-weight: 500; color: var(--muted); }
  .delta { font-size: 13px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }

  .spark { display: block; width: 100%; height: 56px; margin-top: 6px; }
  .nodata { color: var(--muted); font-size: 13px; text-align: center; padding: 18px 0; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0 10px; }
  .status { color: var(--muted); font-size: 14px; text-align: center; padding: 6px 0 12px; }
  .status button {
    margin-left: 6px; color: var(--ink); background: transparent; border: 1.5px solid var(--line);
    border-radius: 10px; padding: 6px 12px; cursor: pointer;
  }

  /* выбор человека, если ссылка без имени */
  .choose { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; text-align: center; }
  .choose h1 { font-size: 22px; margin: 0 0 8px; }
  .choose button {
    display: block; width: 100%; padding: 16px; border-radius: 14px; border: 0; cursor: pointer;
    background: var(--accent); color: var(--on-accent); font-size: 18px; font-weight: 600;
  }
  .choose p { color: var(--muted); font-size: 14px; margin: 8px 0 0; line-height: 1.4; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px;
    font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<main class="screen hidden" id="chooser">
  <div class="choose">
    <h1>Кто вы?</h1>
    <button data-u="vadim" style="--accent: var(--c-vadim)">Вадим</button>
    <button data-u="ochir" style="--accent: var(--c-ochir)">Очир</button>
    <button data-u="oyuna" style="--accent: var(--c-oyuna)">Оюна</button>
    <p>После выбора добавьте страницу на главный экран телефона, и это будет ваша личная ссылка.</p>
  </div>
</main>

<main class="screen" id="s1">
  <section class="entry">
    <div class="date"><span id="date"></span> <button class="link" id="dayBtn" aria-expanded="false">Другой день</button></div>
    <div class="days hidden" id="days">
      <button class="chip" data-off="0">Сегодня</button>
      <button class="chip" data-off="1">Вчера</button>
      <button class="chip" data-off="2">Позавчера</button>
      <input type="date" id="dayPick" aria-label="Другая дата">
    </div>

    <div id="inputView">
      <label for="w" id="label">Вес сегодня</label>
      <div class="field">
        <input id="w" type="text" inputmode="decimal" autocomplete="off" placeholder="00,0" maxlength="5">
        <span>кг</span>
      </div>
      <div class="hint" id="hint" aria-live="polite"></div>
      <button class="save" id="save">Сохранить вес</button>
    </div>

    <div id="savedView" class="hidden">
      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <div class="saved-title">Успешно сохранено</div>
      <div class="saved-weight" id="savedWeight"></div>
      <div class="reaction" id="reaction" aria-live="polite"></div>
      <div class="actions">
        <button class="ghost" id="commentBtn">Комментарий</button>
        <button class="ghost" id="editBtn">Исправить</button>
      </div>
      <div class="comment hidden" id="commentBox">
        <textarea id="commentText" rows="3" maxlength="300" placeholder="Что хотите отметить за сегодня?" aria-label="Комментарий"></textarea>
        <button class="save" id="commentSave">Сохранить комментарий</button>
      </div>
    </div>
  </section>

  <button class="nav" id="toCharts" aria-label="Перейти к графикам">
    Графики
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>
</main>

<section class="screen screen-charts" id="s2">
  <button class="nav up" id="toMain" aria-label="Вернуться к вводу веса">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    Ввод веса
  </button>
  <h2>Все трое</h2>
  <div class="status hidden" id="status"></div>
  <div class="rows" id="rows"></div>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============ НАСТРОЙКА ============ */
// Вставьте сюда адрес веб-приложения из Google Apps Script (заканчивается на /exec).
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby5zCct3wlJvHDezuco-cBwI2NV3LRLD53BuiiUmptf0r35eKl2QyIB-eGpSUUL3MDl-w/exec';
/* =================================== */

const PEOPLE = [
  { id: 'vadim', name: 'Вадим', color: 'var(--c-vadim)' },
  { id: 'ochir', name: 'Очир',  color: 'var(--c-ochir)' },
  { id: 'oyuna', name: 'Оюна',  color: 'var(--c-oyuna)' },
];
const CACHE_KEY = 'family-weight-cache-v2';
const arrow = (dir, label) =>
  `<svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="${label}"><path d="${dir === 'up' ? 'M12 19V5M6 11l6-6 6 6' : 'M12 5v14M6 13l6 6 6-6'}"/></svg>`;

let data = { vadim: {}, ochir: {}, oyuna: {} };       // { id: { 'YYYY-MM-DD': число } }
let comments = { vadim: {}, ochir: {}, oyuna: {} };   // { id: { 'YYYY-MM-DD': текст } }
let expanded = { vadim: false, ochir: false, oyuna: false };
let loadState = 'loading';                            // loading | ok | error
let mode = 'auto';                                    // auto | edit (исправление веса)
let current = null;
let day = null;                                      // выбранный день записи, YYYY-MM-DD
let followToday = true;                               // день сам переходит на новый, пока выбран «сегодня»

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => { const d = new Date(); d.setHours(12, 0, 0, 0); return d; };
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const fmt = v => v.toFixed(1).replace('.', ',');
const person = id => PEOPLE.find(p => p.id === id);
const configured = () => !SCRIPT_URL.includes('ВСТАВЬТЕ');

/* ---------- демо-режим (пока не вставлен адрес скрипта) ---------- */
let demoLoaded = false;
function demoData() {
  const bases = { vadim: 80.4, ochir: 95.2, oyuna: 62.6 };
  const out = { vadim: {}, ochir: {}, oyuna: {} };
  let seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  PEOPLE.forEach(p => {
    let v = bases[p.id];
    for (let i = 29; i >= 1; i--) {
      v += (rnd() - 0.55) * 0.5;
      if (rnd() < 0.1) continue;
      out[p.id][keyOf(addDays(today(), -i))] = Math.round(v * 10) / 10;
    }
  });
  return out;
}

/* ---------- сеть ---------- */
async function call(params) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  try {
    const res = await fetch(`${SCRIPT_URL}?${new URLSearchParams(params)}`, { signal: ctrl.signal, cache: 'no-store' });
    return await res.json();
  } finally { clearTimeout(timer); }
}
function explain(e) {
  if (e && (e.name === 'AbortError' || e.name === 'TypeError')) return 'нет связи. Проверьте интернет или VPN.';
  return (e && e.message) || 'неизвестная ошибка.';
}

function applyRows(rows) {
  const nd = { vadim: {}, ochir: {}, oyuna: {} };
  const nc = { vadim: {}, ochir: {}, oyuna: {} };
  rows.forEach(r => PEOPLE.forEach(p => {
    if (typeof r[p.id] === 'number') nd[p.id][r.date] = r[p.id];
    if (r.comments && r.comments[p.id]) nc[p.id][r.date] = r.comments[p.id];
  }));
  data = nd; comments = nc;
}
async function refresh() {
  if (!configured()) { if (!demoLoaded) { data = demoData(); demoLoaded = true; } loadState = 'ok'; render(); return; }
  try {
    const res = await call({});
    if (!res.ok) throw new Error(res.error || 'Ошибка таблицы');
    applyRows(res.rows);
    loadState = 'ok';
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(res.rows)); } catch (e) {}
  } catch (e) {
    loadState = 'error';
  }
  render();
}

/* ---------- графики ---------- */
function seriesFor(id, n) {
  const t = today(), res = [];
  for (let i = n - 1; i >= 0; i--) {
    const k = keyOf(addDays(t, -i));
    if (data[id][k] != null) res.push({ i: n - 1 - i, v: data[id][k], k });
  }
  return res;
}
// точка без искажения: нулевой отрезок с круглым концом
const dot = (x, y, size, color) =>
  `<path d="M${x.toFixed(1)},${y.toFixed(1)}h0.01" stroke="${color}" stroke-width="${size}" stroke-linecap="round" fill="none" vector-effect="non-scaling-stroke"/>`;

function spark(points, n, color, allDots) {
  const W = 300, H = 56, P = 6;
  if (points.length < 2) return '';
  const vs = points.map(p => p.v);
  let min = Math.min(...vs), max = Math.max(...vs);
  if (max - min < 0.6) { const m = (max + min) / 2; min = m - 0.3; max = m + 0.3; }
  const x = i => P + (i / (n - 1)) * (W - 2 * P);
  const y = v => H - P - ((v - min) / (max - min)) * (H - 2 * P);
  const d = points.map((p, k) => `${k ? 'L' : 'M'}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const last = points[points.length - 1];
  const dots = allDots ? points.slice(0, -1).map(p => dot(x(p.i), y(p.v), 6, color)).join('') : '';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${dots}${dot(x(last.i), y(last.v), 10, color)}
  </svg>`;
}
// Изменение веса: span = 7 для недели, 29 для месяца (в окне из 30 дней).
function periodDelta(points, span, word) {
  if (points.length < 2) return '';
  const last = points[points.length - 1];
  const ref = [...points].reverse().find(p => last.i - p.i >= span) || points[0];
  if (ref === last) return '';
  const diff = Math.round((last.v - ref.v) * 10) / 10;
  const days = last.i - ref.i;
  const sign = diff > 0 ? '+' : diff < 0 ? '−' : '';
  const full = days >= (span === 7 ? 7 : 28);
  return `${sign}${fmt(Math.abs(diff))} кг ${full ? word : `за ${days} дн.`}`;
}
function shortDate(k) {
  return fromKey(k).toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'numeric' });
}

function rowHTML(p) {
  const month = seriesFor(p.id, 30);
  const week = seriesFor(p.id, 7);
  const last = month[month.length - 1];

  // два маленьких блока: максимум и минимум за всю историю
  const all = Object.values(data[p.id]);
  const mx = all.length ? fmt(Math.max(...all)) : '—';
  const mn = all.length ? fmt(Math.min(...all)) : '—';
  const small = (dir, label, v) =>
    `<div class="blk mmbox" role="group" aria-label="${label}: ${v}">${arrow(dir, label)}<span>${v}</span></div>`;
  const left = `<div class="mmcol">${small('up', 'Максимальный вес за всю историю', mx)}${small('down', 'Минимальный вес за всю историю', mn)}</div>`;

  const name = `<div class="name"><span class="dot"></span>${p.name}</div>`;
  if (!last) return `${left}<div class="blk main"><div class="row-top">${name}</div><div class="empty">Записей пока нет</div></div>`;

  const header = (delta) => `<div class="row-top">${name}<div class="val">${fmt(last.v)} <small>кг</small></div></div>
    <div class="delta">${[delta, shortDate(last.k)].filter(Boolean).join(' · ')}</div>`;
  const chart = (pts, n, dots, empty) => pts.length >= 2 ? spark(pts, n, p.color, dots) : `<div class="nodata">${empty}</div>`;
  const weekBlock = `<div class="blk main">${header(periodDelta(month, 7, 'за неделю'))}${chart(week, 7, true, 'За неделю мало записей')}</div>`;
  const monthBlock = `<div class="blk main">${header(periodDelta(month, 29, 'за месяц'))}${chart(month, 30, false, 'За месяц мало записей')}</div>`;
  const tab = (view, text, label) =>
    `<button class="blk tab" data-id="${p.id}" data-view="${view}" aria-label="${label}">${text}</button>`;

  return left + (expanded[p.id]
    ? tab('week', 'Неделя', 'Показать график за неделю') + monthBlock
    : weekBlock + tab('month', 'Месяц', 'Показать график за месяц'));
}

function renderRows() {
  const status = $('status');
  if (loadState === 'error') {
    status.classList.remove('hidden');
    status.innerHTML = 'Не удалось загрузить данные. Проверьте интернет или VPN. <button id="retry">Повторить</button>';
    $('retry').onclick = () => { loadState = 'loading'; render(); refresh(); };
  } else if (loadState === 'loading') {
    status.classList.remove('hidden'); status.textContent = 'Загрузка…';
  } else if (!configured()) {
    status.classList.remove('hidden'); status.textContent = 'Демо-режим: данные выдуманы, в таблицу ничего не сохраняется.';
  } else {
    status.classList.add('hidden');
  }
  $('rows').innerHTML = PEOPLE.map(p =>
    `<div class="row ${p.id === current ? 'me' : ''}" style="--accent:${p.color}">${rowHTML(p)}</div>`
  ).join('');
}

/* ---------- ввод и состояние «сохранено» ---------- */
function setHint(text, err) { const h = $('hint'); h.textContent = text; h.className = 'hint' + (err ? ' err' : ''); }
function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800);
}
// Место для будущих реакций (смайлик и текст в зависимости от изменения веса).
function reactionFor(id) { return ''; }

function renderDate() {
  const long = fromKey(day).toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  const isToday = day === keyOf(today());
  const name = person(current).name;
  $('date').textContent = isToday ? `Сегодня, ${long}` : `Запись за ${long}`;
  $('label').textContent = isToday ? `Вес сегодня, ${name}` : `Вес, ${name}`;
  document.querySelectorAll('#days .chip').forEach(c =>
    c.setAttribute('aria-pressed', String(keyOf(addDays(today(), -Number(c.dataset.off))) === day)));
  const pick = $('dayPick');
  pick.max = keyOf(today()); pick.min = keyOf(addDays(today(), -30)); pick.value = day;
}
function pickDay(k) {
  day = k; followToday = k === keyOf(today()); mode = 'auto';
  setHint(''); $('commentBox').classList.add('hidden');
  renderDate(); renderEntry();
}

function renderEntry() {
  const k = day;
  const todays = data[current][k];
  const saved = mode !== 'edit' && todays != null;
  $('inputView').classList.toggle('hidden', saved);
  $('savedView').classList.toggle('hidden', !saved);
  if (saved) {
    $('savedWeight').textContent = `${fmt(todays)} кг`;
    $('reaction').textContent = reactionFor(current);
    $('commentBtn').textContent = comments[current][k] ? 'Комментарий ✓' : 'Комментарий';
    return;
  }
  const input = $('w');
  if (document.activeElement !== input) input.value = todays != null ? fmt(todays) : '';
  const hasErr = $('hint').classList.contains('err');
  if (!configured()) { if (!hasErr) setHint('Демо-режим: вес не сохраняется в таблицу.'); }
  else if (todays != null) setHint('Исправьте значение и сохраните.');
  else if (!hasErr) setHint('');
}
function render() { renderRows(); renderEntry(); }

async function save() {
  const v = parseFloat($('w').value.trim().replace(',', '.'));
  if (isNaN(v) || v < 20 || v > 300) { setHint('Введите вес в кг, например 72,4', true); return; }
  const val = Math.round(v * 10) / 10;
  const k = day;

  if (!configured()) {
    data[current][k] = val; mode = 'auto'; setHint(''); render();
    toast('Демо: показано, но не сохранено');
    return;
  }
  const btn = $('save');
  btn.disabled = true; btn.textContent = 'Сохраняю…';
  try {
    const res = await call({ action: 'save', person: current, date: k, weight: String(val) });
    if (!res.ok) throw new Error(res.error || 'Ошибка таблицы');
    data[current][k] = val; mode = 'auto'; setHint('');
    render();
    refresh();
  } catch (e) {
    setHint('Не удалось сохранить: ' + explain(e) + ' Нажмите ещё раз.', true);
  } finally {
    btn.disabled = false; btn.textContent = 'Сохранить вес';
  }
}

async function saveComment() {
  const text = $('commentText').value.trim();
  const k = day;
  const btn = $('commentSave');
  if (!configured()) {
    if (text) comments[current][k] = text; else delete comments[current][k];
    $('commentBox').classList.add('hidden'); renderEntry(); toast('Демо: комментарий не сохранён в таблицу');
    return;
  }
  btn.disabled = true; btn.textContent = 'Сохраняю…';
  try {
    const res = await call({ action: 'comment', person: current, date: k, text });
    if (!res.ok) throw new Error(res.error || 'Ошибка таблицы');
    if (text) comments[current][k] = text; else delete comments[current][k];
    $('commentBox').classList.add('hidden'); renderEntry(); toast('Комментарий сохранён');
  } catch (e) {
    toast('Не удалось сохранить: ' + explain(e));
  } finally {
    btn.disabled = false; btn.textContent = 'Сохранить комментарий';
  }
}

/* ---------- запуск ---------- */
function pickPerson(id) {
  try { history.replaceState(null, '', '?u=' + id); } catch (e) {}
  $('chooser').classList.add('hidden');
  $('s1').classList.remove('hidden');
  $('s2').classList.remove('hidden');
  start(person(id));
}

(function init() {
  let id = null;
  try { id = new URLSearchParams(location.search).get('u'); } catch (e) {}
  const p = person(id);
  if (!p) {
    $('s1').classList.add('hidden'); $('s2').classList.add('hidden'); $('chooser').classList.remove('hidden');
    document.querySelectorAll('#chooser button').forEach(b => b.addEventListener('click', () => pickPerson(b.dataset.u)));
    return;
  }
  start(p);
})();

function start(p) {
  current = p.id;
  document.documentElement.style.setProperty('--accent', p.color);
  document.title = `Вес: ${p.name}`;
  day = keyOf(today()); followToday = true;
  renderDate();

  try { const c = JSON.parse(localStorage.getItem(CACHE_KEY)); if (Array.isArray(c)) { applyRows(c); loadState = 'ok'; } } catch (e) {}
  render();
  refresh();

  $('dayBtn').addEventListener('click', () => {
    const box = $('days'); box.classList.toggle('hidden');
    $('dayBtn').setAttribute('aria-expanded', String(!box.classList.contains('hidden')));
  });
  document.querySelectorAll('#days .chip').forEach(c =>
    c.addEventListener('click', () => pickDay(keyOf(addDays(today(), -Number(c.dataset.off))))));
  $('dayPick').addEventListener('change', e => {
    const k = e.target.value, pick = e.target;
    if (k && k >= pick.min && k <= pick.max) pickDay(k); else renderDate();
  });
  $('save').addEventListener('click', save);
  $('w').addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
  $('w').addEventListener('input', () => { if ($('hint').classList.contains('err')) setHint(''); });
  $('editBtn').addEventListener('click', () => { mode = 'edit'; render(); $('w').focus(); $('w').select(); });
  $('commentBtn').addEventListener('click', () => {
    const box = $('commentBox');
    const opening = box.classList.contains('hidden');
    box.classList.toggle('hidden');
    if (opening) { $('commentText').value = comments[current][day] || ''; $('commentText').focus(); }
  });
  $('commentSave').addEventListener('click', saveComment);
  $('rows').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if (!b) return;
    expanded[b.dataset.id] = b.dataset.view === 'month'; renderRows();
  });
  $('toCharts').addEventListener('click', () => $('s2').scrollIntoView({ behavior: 'smooth' }));
  $('toMain').addEventListener('click', () => $('s1').scrollIntoView({ behavior: 'smooth' }));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (followToday && day !== keyOf(today())) { day = keyOf(today()); renderDate(); renderEntry(); }
    refresh();
  });
}
</script>
