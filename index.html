<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Streights">
<meta name="application-name" content="Streights">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f4ecdf" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2a211b" media="(prefers-color-scheme: dark)">
<title>Streights</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4ecdf;
    --surface: #fffaf1;
    --ink: #4a382c;
    --muted: #7a6655;
    --line: #e0d3c0;
    --err: #b5483d;
    --c-vadim: #7db38f;   /* зелёный пастель */
    --c-ochir: #dd7d72;   /* бледно-красный пастель */
    --c-oyuna: #e58db2;   /* розовый пастель */
    --on-accent: #3e2c23;
    --btn: #8a6a52;       /* коричневые кнопки */
    --on-btn: #fff7ea;
    --accent: var(--c-vadim);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #2a211b;
      --surface: #362b23;
      --ink: #f1e6d6;
      --muted: #bba894;
      --line: #4d3f33;
      --err: #f0988c;
      --c-vadim: #9ccbaa;
      --c-ochir: #ee9a90;
      --c-oyuna: #f2a9c7;
      --on-accent: #2a211b;
      --btn: #c9a98a;
      --on-btn: #2a211b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  button, input, textarea, select { font: inherit; }
  ::selection { background: var(--accent); color: var(--on-accent); }
  option { background: var(--surface); color: var(--ink); }
  button:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .screen {
    min-height: 100vh; min-height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always;
    display: flex; flex-direction: column;
    max-width: 480px; margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  }
  .hidden { display: none !important; }

  /* ---------- Экран 1 ---------- */
  .entry { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; }
  .entry-head { margin-bottom: 0; }
  #inputView { margin-top: 6px; }      /* приветствие почти вплотную к дате, как было */
  #savedView { margin-top: 20px; }     /* а кружок с галочкой отодвинут от даты */
  .date { font-size: 16px; line-height: 1.5; color: var(--muted); }
  .entry label { display: block; font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  /* число стоит ровно по центру, «кг» уходит вправо и не сдвигает его */
  .field { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: baseline; column-gap: 8px; }
  .field input { grid-column: 2; }
  .field input {
    width: 5ch; font-size: 76px; font-weight: 700; text-align: center;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    border: 0; border-bottom: 3px solid var(--line); background: transparent; color: var(--ink);
    padding: 0 0 4px; border-radius: 0; outline: none; caret-color: var(--accent);
    transition: border-color .15s;
  }
  .field input::placeholder { color: var(--line); opacity: 1; }
  .field input:focus { border-bottom-color: var(--accent); }
  .field input:focus::placeholder { color: transparent; }
  .field span { grid-column: 3; justify-self: start; font-size: 26px; color: var(--muted); }
  .link { background: none; border: 0; color: var(--muted); font-size: 14px; text-decoration: underline; cursor: pointer; padding: 4px 6px; }
  .days { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 6px 0 10px; }
  .chip { border: 1.5px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
  .chip[aria-pressed="true"] { background-color: var(--btn); border-color: var(--btn); color: var(--on-btn); }
  .chip.more { padding-right: 30px; position: relative; }
  .chip.more::after {
    content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px;
    border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
    transform: translateY(-70%) rotate(45deg);
  }
  .chip.more[aria-expanded="true"]::after { transform: translateY(-30%) rotate(-135deg); }
  .cal { width: 100%; max-width: 320px; margin: 0 auto 10px; }
  .cal-head, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-head { margin-bottom: 4px; }
  .cal-head span { font-size: 12px; color: var(--muted); text-align: center; }
  .cal-day {
    aspect-ratio: 1; border: 0; border-radius: 10px; background: var(--surface); color: var(--ink);
    font-size: 15px; line-height: 1.1; cursor: pointer; position: relative; padding: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .cal-day small { font-size: 9px; color: var(--muted); }
  .cal-day.has::after {
    content: ""; position: absolute; bottom: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  }
  .cal-day.today { box-shadow: inset 0 0 0 1.5px var(--btn); }
  .cal-day.sel { background: var(--btn); color: var(--on-btn); }
  .cal-day.sel small { color: inherit; }
  .cal-day:disabled { opacity: .35; cursor: default; }
  .chip.on { background-color: var(--btn); border-color: var(--btn); color: var(--on-btn); }
  .hint { min-height: 22px; margin: 10px 0 14px; font-size: 14px; color: var(--muted); line-height: 1.4; }
  .hint.err { color: var(--err); }
  .save {
    width: 100%; font-size: 18px; font-weight: 600; padding: 15px;
    border: 0; border-radius: 14px; background: var(--btn); color: var(--on-btn); cursor: pointer;
  }
  .save:disabled { opacity: .6; cursor: default; }
  .save:active:not(:disabled) { transform: translateY(1px); }

  /* после сохранения */
  .check {
    width: 84px; height: 84px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
    display: grid; place-items: center; margin: 0 auto 16px;
    animation: pop .35s ease-out;
  }
  .check svg { width: 44px; height: 44px; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .check { animation: none; } }
  .saved-title { font-size: 26px; font-weight: 700; line-height: 1.2; }
  .saved-weight { font-size: 18px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .saved-diff { font-size: 16px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .reaction { font-size: 20px; font-weight: 600; margin-top: 12px; line-height: 1.3; }
  .reaction:empty { display: none; }
  .actions { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
  .ghost {
    background: transparent; border: 1.5px solid var(--line); color: var(--ink);
    border-radius: 12px; padding: 9px 16px; font-size: 15px; cursor: pointer;
  }
  .comment { margin-top: 16px; text-align: left; }
  .comment textarea {
    width: 100%; font-size: 16px; padding: 12px; border-radius: 12px; resize: none;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .comment .save { margin-top: 10px; font-size: 16px; padding: 12px; }

  .nav {
    align-self: center; display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 14px; color: var(--muted); background: transparent; border: 0;
    padding: 8px 16px; cursor: pointer; border-radius: 12px;
  }
  .nav svg { width: 22px; height: 22px; }
  .nav.up { margin-bottom: 8px; }

  /* ---------- Экран 2 ---------- */
  h2 { font-size: 30px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; color: var(--ink); margin: 2px 0 12px; }
  .rows { display: flex; flex-direction: column; }
  .row { display: flex; gap: 8px; align-items: stretch; margin-bottom: 8px; }
  .blk { background: var(--surface); border-radius: 14px; border: 1.5px solid transparent; }
  .mmcol { flex: 0 0 58px; display: flex; flex-direction: column; gap: 8px; }
  .mmbox {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 6px 2px;
  }
  .arr { width: 18px; height: 18px; color: var(--muted); flex: 0 0 auto; }
  .main { flex: 1; min-width: 0; padding: 12px 12px 8px; }
  .row.me .main { border-color: var(--accent); }
  .pane {
    position: relative; overflow: hidden; min-width: 0; flex: 0 0 40px;
    transition: flex .8s cubic-bezier(.4, 0, .2, 1), border-color .6s;
  }
  .pane.open { flex: 1 1 0px; }
  .row.me .pane.open, .row.me .stats.open .sbox { border-color: var(--accent); }
  .stats {
    flex: 0 0 58px; min-width: 0; display: flex; flex-direction: column; gap: 6px;
    transition: flex .8s cubic-bezier(.4, 0, .2, 1);
  }
  .stats.open { flex: 1 1 0px; }
  .sbox { position: relative; overflow: hidden; flex: 1; min-width: 0; transition: border-color .6s; }
  .sclosed {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;
    opacity: 1; visibility: visible; transition: opacity .45s .4s, visibility 0s;
  }
  .stats.open .sclosed { opacity: 0; visibility: hidden; transition: opacity .3s, visibility 0s .3s; }
  .sopen { padding: 8px 12px; white-space: nowrap; opacity: 0; visibility: hidden; transition: opacity .3s, visibility 0s .3s; }
  .stats.open .sopen { opacity: 1; visibility: visible; transition: opacity .45s .4s, visibility 0s; }
  .s-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .s-label { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13px; }
  .s-val { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .s-val small { font-size: 12px; font-weight: 500; color: var(--muted); }
  .s-line { font-size: 12px; line-height: 1.25; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .stab { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: transparent; cursor: pointer; }
  .face { padding: 10px 12px 6px; white-space: nowrap; }
  .face .delta { overflow: hidden; text-overflow: ellipsis; }
  .pane .face { opacity: 0; visibility: hidden; transition: opacity .3s, visibility 0s .3s; }
  .pane.open .face { opacity: 1; visibility: visible; transition: opacity .45s .4s, visibility 0s; }
  .tabface {
    position: absolute; inset: 0; width: 100%; padding: 0; border: 0; background: transparent; cursor: pointer;
    color: var(--muted); font-size: 13px; letter-spacing: 1px; writing-mode: vertical-rl; text-orientation: upright;
    opacity: 1; visibility: visible; transition: opacity .45s .4s, visibility 0s;
  }
  .pane.open .tabface { opacity: 0; visibility: hidden; transition: opacity .3s, visibility 0s .3s; }
  @media (prefers-reduced-motion: reduce) { .pane, .face, .tabface, .stats, .sbox, .sclosed, .sopen { transition: none !important; } }
  .row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .name { font-weight: 600; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .val { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .val small { font-size: 14px; font-weight: 500; color: var(--muted); }
  .delta { font-size: 13px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }

  .spark { display: block; width: 100%; height: 56px; margin-top: 6px; overflow: visible; }
  .nodata { color: var(--muted); font-size: 13px; text-align: center; padding: 18px 0; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0 10px; }
  .status { color: var(--muted); font-size: 14px; text-align: center; padding: 6px 0 12px; }
  .status button {
    margin-left: 6px; color: var(--ink); background: transparent; border: 1.5px solid var(--line);
    border-radius: 10px; padding: 6px 12px; cursor: pointer;
  }

  /* стрелка к комментариям: видна только когда есть непрочитанный комментарий */
  .arrow {
    align-self: center; position: relative; background: transparent; border: 0; color: var(--muted);
    padding: 8px 18px; cursor: pointer; border-radius: 12px;
  }
  .arrow svg { display: block; width: 26px; height: 26px; }
  .arrow { display: flex; align-items: center; gap: 8px; }
  .alert-tag { display: none; align-items: center; gap: 6px; font-size: 14px; }
  .alert-tag .cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--err); }
  .arrow.alert { color: var(--ink); background: var(--surface); padding: 8px 16px 8px 14px; border-radius: 999px; }
  .arrow.alert .alert-tag { display: inline-flex; }
  .arrow.alert svg { animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @media (prefers-reduced-motion: reduce) { .arrow.alert svg { animation: none; } }

  /* вкладка «Комментарии» */
  .clist { display: flex; flex-direction: column; gap: 8px; }
  #comments > .arrow { margin-top: auto; }
  /* сверху у комментариев стрелки нет, оставляем столько же места, чтобы заголовки «Комментарии» и «Графики» стояли на одной высоте */
  #comments::before { content: ""; display: block; flex: none; height: 42px; }
  .ccard { padding: 14px; }
  .c-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .c-date { font-size: 13px; color: var(--muted); text-align: right; }
  .c-text { margin: 8px 0 12px; font-size: 17px; line-height: 1.35; white-space: pre-wrap; overflow-wrap: anywhere; }
  .c-empty { color: var(--muted); font-size: 14px; margin: 8px 0 2px; }
  .c-hearts { display: flex; gap: 10px; flex-wrap: wrap; }
  .heart {
    display: flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: transparent;
    color: var(--muted); border-radius: 999px; padding: 5px 12px 5px 8px; font-size: 14px; cursor: pointer;
  }
  .heart svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
  .heart.on { border-color: var(--hc); color: var(--ink); }
  .heart.on svg { fill: var(--hc); stroke: var(--hc); animation: pop .3s ease-out; }
  .heart.offer { border-color: var(--hc); color: var(--ink); }
  .heart.offer svg { stroke: var(--hc); }
  span.heart { cursor: default; }
  .chint { color: var(--muted); font-size: 13px; text-align: center; margin: 14px 0 0; line-height: 1.4; }
  @media (prefers-reduced-motion: reduce) { .heart.on svg { animation: none; } }

  /* выбор человека, если ссылка без имени */
  .choose { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; text-align: center; }
  .choose h1 { font-size: 22px; margin: 0 0 8px; }
  .choose button {
    display: block; width: 100%; padding: 16px; border-radius: 14px; border: 0; cursor: pointer;
    background: var(--btn); color: var(--on-btn); font-size: 18px; font-weight: 600;
  }
  .choose button::before {
    content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); margin-right: 10px; vertical-align: -1px;
  }
  .choose p { color: var(--muted); font-size: 14px; margin: 8px 0 0; line-height: 1.4; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px;
    font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<main class="screen hidden" id="chooser">
  <div class="choose">
    <h1>Кто вы?</h1>
    <button data-u="vadim" style="--accent: var(--c-vadim)">Вадим</button>
    <button data-u="ochir" style="--accent: var(--c-ochir)">Очир</button>
    <button data-u="oyuna" style="--accent: var(--c-oyuna)">Оюна</button>
    <p>После выбора добавьте страницу на главный экран телефона, и это будет ваша личная ссылка.</p>
  </div>
</main>

<section class="screen" id="comments">
  <h2>Комментарии</h2>
  <div class="clist" id="clist"></div>
  <p class="chint">Написать комментарий можно после сохранения веса: кнопка «Комментарий».</p>
  <button class="arrow down" data-go="s1" aria-label="Вниз: ввод веса">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>
</section>

<main class="screen" id="s1">
  <button class="arrow up" data-go="comments" aria-label="Вверх: комментарии">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    <span class="alert-tag"><span class="cdot"></span><span class="albl"></span></span>
  </button>
  <section class="entry">
    <div class="entry-head">
    <div class="date"><span id="date"></span> <button class="link" id="dayBtn" aria-expanded="false">Другой день</button></div>
    <div class="days hidden" id="days">
      <button class="chip" data-off="0">Сегодня</button>
      <button class="chip" data-off="1">Вчера</button>
      <button class="chip" data-off="2">Позавчера</button>
      <button class="chip more" id="moreBtn" aria-expanded="false"><span id="moreText">Другая дата</span></button>
    </div>

    <div class="cal hidden" id="cal">
      <div class="cal-head" aria-hidden="true"><span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>вс</span></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    </div>

    <div id="inputView">
      <label for="w" id="label">Вес сегодня</label>
      <div class="field">
        <input id="w" aria-label="Вес в килограммах" type="text" inputmode="decimal" autocomplete="off" placeholder="00,0" maxlength="5">
        <span>кг</span>
      </div>
      <div class="hint" id="hint" aria-live="polite"></div>
      <button class="save" id="save">Сохранить вес</button>
    </div>

    <div id="savedView" class="hidden">
      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <div class="saved-title">Успешно сохранено</div>
      <div class="saved-weight" id="savedWeight"></div>
      <div class="saved-diff" id="savedDiff"></div>
      <div class="reaction" id="reaction" aria-live="polite"></div>
      <div class="actions">
        <button class="ghost" id="commentBtn">Комментарий</button>
        <button class="ghost" id="editBtn">Исправить</button>
      </div>
      <div class="comment hidden" id="commentBox">
        <textarea id="commentText" rows="3" maxlength="300" placeholder="Что хотите отметить за сегодня?" aria-label="Комментарий"></textarea>
        <button class="save" id="commentSave">Сохранить комментарий</button>
      </div>
    </div>
  </section>

  <button class="link hidden" id="installBtn" style="align-self:center">Установить приложение</button>

  <button class="arrow down" data-go="s2" aria-label="Вниз: графики">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>
</main>

<section class="screen screen-charts" id="s2">
  <button class="arrow up" data-go="s1" aria-label="Вверх: ввод веса">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
  </button>
  <h2>Графики</h2>
  <div class="status hidden" id="status"></div>
  <div class="rows" id="rows"></div>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============ НАСТРОЙКА ============ */
// Вставьте сюда адрес веб-приложения из Google Apps Script (заканчивается на /exec).
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby5zCct3wlJvHDezuco-cBwI2NV3LRLD53BuiiUmptf0r35eKl2QyIB-eGpSUUL3MDl-w/exec';
/* =================================== */

// Демо-режим: если к ссылке добавить &demo=1, сайт показывает выдуманные данные и ничего не пишет в таблицу.
const DEMO = (() => { try { return new URLSearchParams(location.search).has('demo'); } catch (e) { return false; } })();

const PEOPLE = [
  { id: 'vadim', name: 'Вадим', color: 'var(--c-vadim)' },
  { id: 'ochir', name: 'Очир',  color: 'var(--c-ochir)' },
  { id: 'oyuna', name: 'Оюна',  color: 'var(--c-oyuna)' },
];
const CACHE_KEY = 'family-weight-cache-v2';
const arrow = (dir, label) =>
  `<svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" ${label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"'}><path d="${dir === 'up' ? 'M12 19V5M6 11l6-6 6 6' : 'M12 5v14M6 13l6 6 6-6'}"/></svg>`;

let data = { vadim: {}, ochir: {}, oyuna: {} };       // { id: { 'YYYY-MM-DD': число } }
let comments = { vadim: {}, ochir: {}, oyuna: {} };   // { id: { 'YYYY-MM-DD': текст } }
let views = { vadim: 'week', ochir: 'week', oyuna: 'week' };   // раскрыт один блок: week | month | stats
let reacts = new Set();                               // 'автор|дата|кто поставил'
let settled = false;                                  // пользователь уже сам листал экран
let commentsVisible = false;                           // экран комментариев сейчас на виду
let lastSig = '';                                      // отпечаток последних данных, чтобы не перерисовывать зря
let loadState = 'loading';                            // loading | ok | error
let mode = 'auto';                                    // auto | edit (исправление веса)
let current = null;
let day = null;                                      // выбранный день записи, YYYY-MM-DD
let followToday = true;                               // день сам переходит на новый, пока выбран «сегодня»

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => { const d = new Date(); d.setHours(12, 0, 0, 0); return d; };
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const fmt = v => v.toFixed(1).replace('.', ',');
const person = id => PEOPLE.find(p => p.id === id);
const configured = () => !DEMO && !SCRIPT_URL.includes('ВСТАВЬТЕ');

/* ---------- демо-режим (пока не вставлен адрес скрипта) ---------- */
let demoLoaded = false;
function demoData() {
  const bases = { vadim: 92.0, ochir: 95.4, oyuna: 67.5 };
  const out = { vadim: {}, ochir: {}, oyuna: {} };
  let seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  PEOPLE.forEach(p => {
    let v = bases[p.id];
    for (let i = 29; i >= 1; i--) {
      v += (rnd() - 0.55) * 0.5;
      if (rnd() < 0.1) continue;
      out[p.id][keyOf(addDays(today(), -i))] = Math.round(v * 10) / 10;
    }
  });
  return out;
}

function demoComments() {
  const k = n => keyOf(addDays(today(), -n));
  return {
    vadim: { [k(2)]: 'Вчера поздно ужинал, сегодня сам себя прощаю' },
    ochir: { [k(1)]: 'Тренировка зашла отлично, завтра повторим' },
    oyuna: { [k(3)]: 'Взвесилась после поездки, всё в порядке, дети!' },
  };
}
function demoReacts() { return new Set([`oyuna|${keyOf(addDays(today(), -3))}|vadim`, `ochir|${keyOf(addDays(today(), -1))}|oyuna`]); }

/* ---------- сеть ---------- */
async function call(params) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  try {
    const res = await fetch(`${SCRIPT_URL}?${new URLSearchParams(params)}`, { signal: ctrl.signal, cache: 'no-store' });
    return await res.json();
  } finally { clearTimeout(timer); }
}
function explain(e) {
  if (e && (e.name === 'AbortError' || e.name === 'TypeError')) return 'нет связи. Проверьте интернет или VPN.';
  return (e && e.message) || 'неизвестная ошибка.';
}

function applyRows(rows) {
  const nd = { vadim: {}, ochir: {}, oyuna: {} };
  const nc = { vadim: {}, ochir: {}, oyuna: {} };
  rows.forEach(r => PEOPLE.forEach(p => {
    if (typeof r[p.id] === 'number') nd[p.id][r.date] = r[p.id];
    if (r.comments && r.comments[p.id]) nc[p.id][r.date] = r.comments[p.id];
  }));
  data = nd; comments = nc;
}
function applyReactions(list) {
  reacts = new Set((list || []).map(r => `${r.author}|${r.date}|${r.by}`));
}
async function refresh() {
  if (!configured()) {
    if (!demoLoaded) { data = demoData(); comments = demoComments(); reacts = demoReacts(); demoLoaded = true; }
    loadState = 'ok'; render(); return;
  }
  try {
    const res = await call({});
    if (!res.ok) throw new Error(res.error || 'Ошибка таблицы');
    const sig = JSON.stringify([res.rows, res.reactions]);
    if (sig === lastSig && loadState === 'ok') return;       // ничего не изменилось
    lastSig = sig;
    applyRows(res.rows);
    applyReactions(res.reactions);
    loadState = 'ok';
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ rows: res.rows, reactions: res.reactions || [] })); } catch (e) {}
  } catch (e) {
    loadState = 'error';
  }
  render();
}

/* ---------- графики ---------- */
function seriesFor(id, n) {
  const t = today(), res = [];
  for (let i = n - 1; i >= 0; i--) {
    const k = keyOf(addDays(t, -i));
    if (data[id][k] != null) res.push({ i: n - 1 - i, v: data[id][k], k });
  }
  return res;
}
// точка без искажения: нулевой отрезок с круглым концом
const dot = (x, y, size, color) =>
  `<path d="M${x.toFixed(1)},${y.toFixed(1)}h0.01" stroke="${color}" stroke-width="${size}" stroke-linecap="round" fill="none" vector-effect="non-scaling-stroke"/>`;

function spark(points, n, color, allDots) {
  const W = 300, H = 56, P = 6;
  if (points.length < 2) return '';
  const vs = points.map(p => p.v);
  let min = Math.min(...vs), max = Math.max(...vs);
  if (max - min < 0.6) { const m = (max + min) / 2; min = m - 0.3; max = m + 0.3; }
  const x = i => P + (i / (n - 1)) * (W - 2 * P);
  const y = v => H - P - ((v - min) / (max - min)) * (H - 2 * P);
  const d = points.map((p, k) => `${k ? 'L' : 'M'}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const last = points[points.length - 1];
  const dots = allDots ? points.slice(0, -1).map(p => dot(x(p.i), y(p.v), 6, color)).join('') : '';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${dots}${dot(x(last.i), y(last.v), 10, color)}
  </svg>`;
}
// Изменение веса: span = 7 для недели, 29 для месяца (в окне из 30 дней).
function periodDelta(points, span, word) {
  if (points.length < 2) return '';
  const last = points[points.length - 1];
  const ref = [...points].reverse().find(p => last.i - p.i >= span) || points[0];
  if (ref === last) return '';
  const diff = Math.round((last.v - ref.v) * 10) / 10;
  const days = last.i - ref.i;
  const sign = diff > 0 ? '+' : diff < 0 ? '−' : '';
  const full = days >= (span === 7 ? 7 : 28);
  return `${sign}${fmt(Math.abs(diff))} кг ${full ? word : `за ${days} дн.`}`;
}
function shortDate(k) {
  return fromKey(k).toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'numeric' });
}

// Максимум и минимум за всю историю человека, с датами записей.
function statsFor(id) {
  const e = Object.entries(data[id]).sort((a, b) => (a[0] < b[0] ? -1 : 1));
  if (!e.length) return null;
  let max = e[0], min = e[0];
  e.forEach(x => { if (x[1] >= max[1]) max = x; if (x[1] <= min[1]) min = x; });   // при равенстве берём более свежую
  return { latest: e[e.length - 1], max, min };
}
function agoText(k) {
  const days = Math.round((today() - fromKey(k)) / 86400000);
  if (days <= 0) return 'сегодня';
  if (days === 1) return 'вчера';
  if (days < 14) return `${days} дн. назад`;
  if (days < 60) return `${Math.round(days / 7)} нед. назад`;
  return `${Math.round(days / 30)} мес. назад`;
}
function statDate(k) {
  const d = fromKey(k);
  const opts = { weekday: 'short', day: 'numeric', month: 'short' };
  if (d.getFullYear() !== today().getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString('ru-RU', opts);
}
function vsCurrent(v, entry, latest) {
  if (entry[0] === latest[0]) return 'это последняя запись';
  const d = Math.round((v - latest[1]) * 10) / 10;
  if (d === 0) return 'как сейчас';
  return `с текущим: ${d > 0 ? '+' : '−'}${fmt(Math.abs(d))} кг`;
}

function rowHTML(p) {
  const month = seriesFor(p.id, 30);
  const week = seriesFor(p.id, 7);
  const last = month[month.length - 1];
  const name = `<div class="name"><span class="dot"></span>${p.name}</div>`;
  const st = statsFor(p.id);

  // нет ни одной записи
  if (!st) {
    const small = (dir, label) => `<div class="blk mmbox" role="group" aria-label="${label}: нет данных">${arrow(dir, label)}<span>—</span></div>`;
    return `<div class="mmcol">${small('up', 'Максимальный вес за всё время')}${small('down', 'Минимальный вес за всё время')}</div>
      <div class="blk main"><div class="row-top">${name}</div><div class="empty">Записей пока нет</div></div>`;
  }

  const view = views[p.id];

  // блок «максимум / минимум за всё время»: закрытый — стрелка и число, открытый — подробности
  const box = (kind, entry) => {
    const up = kind === 'max';
    const title = up ? 'Максимум' : 'Минимум';
    return `<div class="blk sbox">
      <div class="sclosed">${arrow(up ? 'up' : 'down', '')}<span>${fmt(entry[1])}</span></div>
      <div class="sopen">
        <div class="s-top"><span class="s-label">${arrow(up ? 'up' : 'down', '')}${title}</span><span class="s-val">${fmt(entry[1])} <small>кг</small></span></div>
        <div class="s-line">${statDate(entry[0])} · ${agoText(entry[0])}</div>
        <div class="s-line">${vsCurrent(entry[1], entry, st.latest)}</div>
      </div>
      <button class="stab" data-id="${p.id}" aria-label="${title} за всё время: ${fmt(entry[1])} кг. Показать или скрыть подробности"></button>
    </div>`;
  };
  const stats = `<div class="stats${view === 'stats' ? ' open' : ''}">${box('max', st.max)}${box('min', st.min)}</div>`;

  const header = (delta) => `<div class="row-top">${name}<div class="val">${fmt(last.v)} <small>кг</small></div></div>
    <div class="delta">${[delta, shortDate(last.k)].filter(Boolean).join(' · ')}</div>`;
  const chart = (pts, n, dots, empty) => pts.length >= 2 ? spark(pts, n, p.color, dots) : `<div class="nodata">${empty}</div>`;
  // три блока всегда в разметке: переключение идёт сменой классов, поэтому оно анимируется
  const pane = (v, delta, chartHTML, tabText, tabLabel) =>
    `<div class="blk pane${view === v ? ' open' : ''}" data-view="${v}">
       <div class="face">${header(delta)}${chartHTML}</div>
       <button class="tabface" data-id="${p.id}" data-view="${v}" aria-label="${tabLabel}">${tabText}</button>
     </div>`;
  return stats
    + pane('week', periodDelta(month, 7, 'за неделю'), chart(week, 7, true, 'За неделю мало записей'), 'Неделя', 'Показать график за неделю')
    + pane('month', periodDelta(month, 29, 'за месяц'), chart(month, 30, false, 'За месяц мало записей'), 'Месяц', 'Показать график за месяц');
}

function setView(row, id, v) {
  views[id] = v;
  row.querySelector('.stats').classList.toggle('open', v === 'stats');
  row.querySelector('.pane[data-view="week"]').classList.toggle('open', v === 'week');
  row.querySelector('.pane[data-view="month"]').classList.toggle('open', v === 'month');
}

function renderRows() {
  const status = $('status');
  if (loadState === 'error') {
    status.classList.remove('hidden');
    status.innerHTML = 'Не удалось загрузить данные. Проверьте интернет или VPN. <button id="retry">Повторить</button>';
    $('retry').onclick = () => { loadState = 'loading'; render(); refresh(); };
  } else if (loadState === 'loading') {
    status.classList.remove('hidden'); status.textContent = 'Загрузка…';
  } else if (!configured()) {
    status.classList.remove('hidden'); status.textContent = 'Демо-режим: данные выдуманы, в таблицу ничего не сохраняется.';
  } else {
    status.classList.add('hidden');
  }
  $('rows').innerHTML = PEOPLE.map(p =>
    `<div class="row ${p.id === current ? 'me' : ''}" style="--accent:${p.color}">${rowHTML(p)}</div>`
  ).join('');
}

/* ---------- ввод и состояние «сохранено» ---------- */
function setHint(text, err) { const h = $('hint'); h.textContent = text; h.className = 'hint' + (err ? ' err' : ''); }
function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800);
}
// Надпись над вводом: утром личное приветствие, после 12:00 общая (только когда вводится вес за сегодня).
const GREETINGS = { vadim: 'Утро добрым не бывает', ochir: 'Утречка', oyuna: 'Доброго утра, ма' };
const LATE = 'Опаздываем, ай, я, яй';
function greeting(id) { return new Date().getHours() < 12 ? GREETINGS[id] : LATE; }

// Разница с предыдущей записью (самой свежей до выбранного дня).
function prevEntry(id, k) {
  let best = null;
  for (const d in data[id]) if (d < k && (!best || d > best)) best = d;
  return best ? { k: best, v: data[id][best] } : null;
}
function diffInfo(id, k) {
  const v = data[id][k];
  if (v == null) return null;
  const prev = prevEntry(id, k);
  if (!prev) return null;
  const dt = Math.round(v * 10) - Math.round(prev.v * 10);          // в десятых долях кг
  return { dt, prev, isYesterday: keyOf(addDays(fromKey(k), -1)) === prev.k };
}
function diffText(info) {
  const from = info.isYesterday ? 'вчерашнего веса' : `записи за ${shortDate(info.prev.k)}`;
  if (info.dt === 0) return `Без изменений от ${from}`;
  return `${info.dt > 0 ? '+' : '−'}${fmt(Math.abs(info.dt) / 10)} кг от ${from}`;
}
// Реакция на снижение веса: на 0,1–0,3 кг и на 0,4 кг и больше. На прибавку и «без изменений» молчим.
function reactionFor(info) {
  if (!info) return '';
  if (info.dt <= -4) return 'ВАУ! Зетс куайт а хьюдж степ';
  if (info.dt <= -1) return 'Прогрессик прослеживается';
  return '';
}

function renderDate() {
  if (!validDay(day)) { day = keyOf(today()); followToday = true; }
  const long = fromKey(day).toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  const isToday = day === keyOf(today());
  const name = person(current).name;
  $('date').textContent = isToday ? `Сегодня, ${long}` : `Запись за ${long}`;
  $('label').textContent = isToday ? (greeting(current) || `Вес сегодня, ${name}`) : `Вес, ${name}`;
  document.querySelectorAll('#days .chip[data-off]').forEach(c =>
    c.setAttribute('aria-pressed', String(keyOf(addDays(today(), -Number(c.dataset.off))) === day)));
  const custom = ![0, 1, 2].some(o => keyOf(addDays(today(), -o)) === day);
  $('moreBtn').classList.toggle('on', custom);
  $('moreText').textContent = custom
    ? fromKey(day).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })
    : 'Другая дата';
  renderCal();
}
function renderCal() {
  if (!current) return;
  const t = today();
  const mon = new Date(t); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
  const start = addDays(mon, -28);                       // 5 недель, последняя — текущая
  const min = keyOf(addDays(t, -30)), max = keyOf(t);
  let html = '';
  for (let i = 0; i < 35; i++) {
    const d = addDays(start, i), k = keyOf(d);
    const off = k < min || k > max;
    const has = data[current] && data[current][k] != null;
    const month = d.getDate() === 1 ? `<small>${d.toLocaleDateString('ru-RU', { month: 'short' }).replace('.', '')}</small>` : '';
    const label = d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }) + (has ? ', вес записан' : '');
    html += `<button class="cal-day${k === day ? ' sel' : ''}${k === max ? ' today' : ''}${has ? ' has' : ''}" data-k="${k}" ${off ? 'disabled' : ''} aria-label="${label}" aria-pressed="${k === day}">${d.getDate()}${month}</button>`;
  }
  $('calGrid').innerHTML = html;
}
function closeCal() {
  $('cal').classList.add('hidden');
  $('moreBtn').setAttribute('aria-expanded', 'false');
}
function validDay(k) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(k || '')) return false;
  const d = fromKey(k);
  return !isNaN(d.getTime()) && keyOf(d) === k && k >= keyOf(addDays(today(), -30)) && k <= keyOf(today());
}
function pickDay(k) {
  if (!validDay(k)) { renderDate(); return; }
  day = k; followToday = k === keyOf(today()); mode = 'auto';
  setHint(''); $('commentBox').classList.add('hidden'); closeCal();
  renderDate(); renderEntry();
}

function renderEntry() {
  const k = day;
  const todays = data[current][k];
  const saved = mode !== 'edit' && todays != null;
  $('inputView').classList.toggle('hidden', saved);
  $('savedView').classList.toggle('hidden', !saved);
  if (saved) {
    $('savedWeight').textContent = `${fmt(todays)} кг`;
    const info = diffInfo(current, day);
    $('savedDiff').textContent = info ? diffText(info) : '';
    $('reaction').textContent = reactionFor(info);
    $('commentBtn').textContent = comments[current][k] ? 'Комментарий ✓' : 'Комментарий';
    return;
  }
  const input = $('w');
  if (document.activeElement !== input) input.value = todays != null ? fmt(todays) : '';
  const hasErr = $('hint').classList.contains('err');
  if (!configured()) { if (!hasErr) setHint('Демо-режим: вес не сохраняется в таблицу.'); }
  else if (todays != null) setHint('Исправьте значение и сохраните.');
  else if (!hasErr) setHint('');
}
const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
const SEEN_KEY = 'streights-seen-v1';
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function latestComment(id) {
  const ks = Object.keys(comments[id]).filter(k => comments[id][k]).sort();
  const k = ks[ks.length - 1];
  return k ? { k, text: comments[id][k] } : null;
}
let demoSeen = {};                                      // в демо-режиме «прочитано» живёт только пока открыта страница
function loadSeen() {
  if (!configured()) return demoSeen;
  try { return JSON.parse(localStorage.getItem(SEEN_KEY)) || {}; } catch (e) { return {}; }
}
function myReactionKeys() {
  const c = latestComment(current);
  return c ? PEOPLE.filter(r => r.id !== current).map(r => `${current}|${c.k}|${r.id}`).filter(k => reacts.has(k)) : [];
}
function markSeen() {
  const seen = loadSeen();
  PEOPLE.forEach(p => { const c = latestComment(p.id); if (c) seen[p.id] = c.k; });
  seen.reactions = myReactionKeys();
  if (!configured()) { demoSeen = seen; return; }
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) {}
}
function unseenInfo() {
  const seen = loadSeen();
  const comments = PEOPLE.filter(p => { const c = latestComment(p.id); return p.id !== current && c && c.k > (seen[p.id] || ''); }).length;
  const known = new Set(seen.reactions || []);
  const reactions = myReactionKeys().filter(k => !known.has(k)).length;
  return { comments, reactions };
}
function hasUnseen() { const u = unseenInfo(); return u.comments + u.reactions > 0; }
function unseenLabel(u) {
  if (u.comments && u.reactions) return 'Новое в комментариях';
  if (u.comments) return u.comments === 1 ? 'Новый комментарий' : 'Новые комментарии';
  return u.reactions === 1 ? 'Новая реакция' : 'Новые реакции';
}
function updateCue() {
  const u = unseenInfo();
  const alert = !commentsVisible && u.comments + u.reactions > 0;
  const label = alert ? unseenLabel(u) : '';
  document.querySelectorAll('[data-go="comments"]').forEach(b => {
    b.classList.toggle('alert', alert);
    const l = b.querySelector('.albl'); if (l) l.textContent = label;
    b.setAttribute('aria-label', alert ? `${label}. Перейти к комментариям` : 'Вверх: комментарии');
  });
}

function renderComments() {
  if (!current) return;
  $('clist').innerHTML = PEOPLE.map(p => {
    const head = `<div class="c-head"><div class="name"><span class="dot"></span>${p.name}</div>`;
    const c = latestComment(p.id);
    if (!c) return `<article class="blk ccard" style="--accent:${p.color}">${head}</div><div class="c-empty">${p.id === current ? 'Комментариев пока нет' : 'Комментария пока нет. Когда он появится, здесь можно будет поставить сердечко.'}</div></article>`;
    const when = `${fromKey(c.k).toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' })} · ${agoText(c.k)}`;
    // своё сердечко: приглашение в твоём цвете; чужие сердечки видны, только когда они поставлены
    const parts = [];
    PEOPLE.filter(r => r.id !== p.id).forEach(r => {
      const on = reacts.has(`${p.id}|${c.k}|${r.id}`);
      if (r.id === current) {
        parts.push(`<button class="heart${on ? ' on' : ' offer'}" style="--hc:${r.color}" data-author="${p.id}" data-date="${c.k}" aria-pressed="${on}"
          aria-label="${on ? 'Убрать сердечко' : 'Поставить сердечко'}">${HEART}${on ? 'Вы' : 'Поставить'}</button>`);
      } else if (on) {
        parts.push(`<span class="heart on" style="--hc:${r.color}" aria-label="Сердечко от ${r.name}">${HEART}${r.name}</span>`);
      }
    });
    const hearts = parts.length ? parts.join('') : (p.id === current ? '<div class="c-empty">Пока без реакций</div>' : '');
    return `<article class="blk ccard" style="--accent:${p.color}">${head}<div class="c-date">${when}</div></div>
      <p class="c-text">${esc(c.text)}</p><div class="c-hearts">${hearts}</div></article>`;
  }).join('');
  if (commentsVisible) markSeen();
  updateCue();
}

async function toggleHeart(btn) {
  const key = `${btn.dataset.author}|${btn.dataset.date}|${current}`;
  const on = !reacts.has(key);
  if (on) reacts.add(key); else reacts.delete(key);
  renderComments();
  if (!configured()) { toast('Демо: сердечко не сохраняется'); return; }
  try {
    const res = await call({ action: 'react', person: current, author: btn.dataset.author, date: btn.dataset.date, on: on ? '1' : '0' });
    if (!res.ok) throw new Error(res.error || 'Ошибка таблицы');
    if (res.rows) throw new Error('скрипт в Google ещё не обновлён (нужна новая версия Code.gs)');
  } catch (e) {
    if (on) reacts.delete(key); else reacts.add(key);      // откатываем
    renderComments();
    toast('Не удалось сохранить: ' + explain(e));
  }
}

function render() { renderRows(); renderEntry(); renderCal(); renderComments(); }

async function save() {
  const v = parseFloat($('w').value.trim().replace(',', '.'));
  if (isNaN(v) || v < 20 || v > 300) { setHint('Введите вес в кг, например 72,4', true); return; }
  const val = Math.round(v * 10) / 10;
  const k = day;

  if (!configured()) {
    data[current][k] = val; mode = 'auto'; setHint(''); render();
    toast('Демо: показано, но не сохранено');
    return;
  }
  const btn = $('save');
  btn.disabled = true; btn.textContent = 'Сохраняю…';
  try {
    const res = await call({ action: 'save', person: current, date: k, weight: String(val) });
    if (!res.ok) throw new Error(res.error || 'Ошибка таблицы');
    data[current][k] = val; mode = 'auto'; setHint('');
    render();
    refresh();
  } catch (e) {
    setHint('Не удалось сохранить: ' + explain(e) + ' Нажмите ещё раз.', true);
  } finally {
    btn.disabled = false; btn.textContent = 'Сохранить вес';
  }
}

async function saveComment() {
  const text = $('commentText').value.trim();
  const k = day;
  const btn = $('commentSave');
  if (!configured()) {
    if (text) comments[current][k] = text; else delete comments[current][k];
    $('commentBox').classList.add('hidden'); renderEntry(); toast('Демо: комментарий не сохранён в таблицу');
    return;
  }
  btn.disabled = true; btn.textContent = 'Сохраняю…';
  try {
    const res = await call({ action: 'comment', person: current, date: k, text });
    if (!res.ok) throw new Error(res.error || 'Ошибка таблицы');
    if (text) comments[current][k] = text; else delete comments[current][k];
    $('commentBox').classList.add('hidden'); renderEntry(); toast('Комментарий сохранён');
  } catch (e) {
    toast('Не удалось сохранить: ' + explain(e));
  } finally {
    btn.disabled = false; btn.textContent = 'Сохранить комментарий';
  }
}

/* ---------- запуск ---------- */
function pickPerson(id) {
  try { history.replaceState(null, '', '?u=' + id + (DEMO ? '&demo=1' : '')); } catch (e) {}
  $('chooser').classList.add('hidden');
  $('s1').classList.remove('hidden');
  $('s2').classList.remove('hidden');
  $('comments').classList.remove('hidden');
  start(person(id));
}

(function init() {
  let id = null;
  try { id = new URLSearchParams(location.search).get('u'); } catch (e) {}
  const p = person(id);
  if (!p) {
    $('s1').classList.add('hidden'); $('s2').classList.add('hidden'); $('comments').classList.add('hidden'); $('chooser').classList.remove('hidden');
    document.querySelectorAll('#chooser button').forEach(b => b.addEventListener('click', () => pickPerson(b.dataset.u)));
    return;
  }
  start(p);
})();

// Экран ввода веса в середине: при открытии всегда показываем именно его, комментарии остаются сверху, графики снизу.
function goHome() {
  if (settled) return;
  const t = $('s1').offsetTop;
  if (Math.abs(window.scrollY - t) > 2) window.scrollTo({ top: t, behavior: 'instant' });
}
function armHome() {
  settled = false;
  try { history.scrollRestoration = 'manual'; } catch (e) {}
  goHome();
  requestAnimationFrame(() => requestAnimationFrame(goHome));
  [150, 500, 1200].forEach(t => setTimeout(goHome, t));       // на случай, если экран ещё перестраивается
  window.addEventListener('load', goHome, { once: true });
  window.addEventListener('pageshow', goHome);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(goHome);
  // как только человек сам начал листать, больше не вмешиваемся
  ['touchstart', 'wheel', 'keydown', 'pointerdown'].forEach(ev => window.addEventListener(ev, () => { settled = true; }, { passive: true, once: true }));
}

function setManifest(id) {
  let l = document.querySelector('link[rel="manifest"]');
  if (!l) { l = document.createElement('link'); l.rel = 'manifest'; document.head.appendChild(l); }
  l.href = `manifest-${id}.webmanifest`;          // у каждого свой start_url с ?u=имя
}

let installEvent = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvent = e;
  if (!window.matchMedia('(display-mode: standalone)').matches) $('installBtn').classList.remove('hidden');
});
window.addEventListener('appinstalled', () => { installEvent = null; $('installBtn').classList.add('hidden'); toast('Установлено'); });

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

function start(p) {
  current = p.id;
  setManifest(p.id);
  document.documentElement.style.setProperty('--accent', p.color);
  day = keyOf(today()); followToday = true;
  renderDate();

  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (Array.isArray(c)) { applyRows(c); loadState = 'ok'; }
    else if (c && Array.isArray(c.rows)) { applyRows(c.rows); applyReactions(c.reactions); loadState = 'ok'; }
  } catch (e) {}
  render();
  armHome();
  refresh().then(goHome);

  $('dayBtn').addEventListener('click', () => {
    const box = $('days'); box.classList.toggle('hidden');
    if (box.classList.contains('hidden')) closeCal();
    $('dayBtn').setAttribute('aria-expanded', String(!box.classList.contains('hidden')));
  });
  document.querySelectorAll('#days .chip[data-off]').forEach(c =>
    c.addEventListener('click', () => pickDay(keyOf(addDays(today(), -Number(c.dataset.off))))));
  $('moreBtn').addEventListener('click', () => {
    const box = $('cal'); box.classList.toggle('hidden');
    $('moreBtn').setAttribute('aria-expanded', String(!box.classList.contains('hidden')));
  });
  $('calGrid').addEventListener('click', e => {
    const b = e.target.closest('.cal-day');
    if (b && !b.disabled) pickDay(b.dataset.k);
  });
  $('save').addEventListener('click', save);
  $('installBtn').addEventListener('click', async () => {
    if (!installEvent) return;
    installEvent.prompt();
    await installEvent.userChoice.catch(() => {});
    installEvent = null; $('installBtn').classList.add('hidden');
  });
  $('w').addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
  $('w').addEventListener('input', () => { if ($('hint').classList.contains('err')) setHint(''); });
  $('editBtn').addEventListener('click', () => { mode = 'edit'; render(); $('w').focus(); $('w').select(); });
  $('commentBtn').addEventListener('click', () => {
    const box = $('commentBox');
    const opening = box.classList.contains('hidden');
    box.classList.toggle('hidden');
    if (opening) { $('commentText').value = comments[current][day] || ''; $('commentText').focus(); }
  });
  $('commentSave').addEventListener('click', saveComment);
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => $(b.dataset.go).scrollIntoView({ behavior: 'smooth' })));
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(es => {
      commentsVisible = es[0].isIntersecting;
      if (commentsVisible) { markSeen(); refresh(); }
      updateCue();
    }, { threshold: 0.6 }).observe($('comments'));
  }
  $('clist').addEventListener('click', e => {
    const b = e.target.closest('.heart');
    if (b && !b.disabled) toggleHeart(b);
  });
  $('rows').addEventListener('click', e => {
    const tab = e.target.closest('.tabface'), stab = e.target.closest('.stab');
    const b = tab || stab; if (!b) return;
    const id = b.dataset.id;
    setView(b.closest('.row'), id, tab ? tab.dataset.view : (views[id] === 'stats' ? 'week' : 'stats'));
  });
  setInterval(() => { if (!document.hidden) refresh(); }, 60000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (followToday && day !== keyOf(today())) day = keyOf(today());
    renderDate(); renderEntry();
    refresh();
  });
}
</script>
</body>
